name: materialize

on:
  push:
    paths:
      - 'build/RClient.lua.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand payload
        run: |
          set -e
          base64 -d build/RClient.lua.gz.b64 | gunzip > RClient.lua
          wc -l RClient.lua
      - name: Commit client
        run: |
          git config user.name "r-client bot"
          git config user.email "actions@users.noreply.github.com"
          git add RClient.lua
          git commit -m "Materialize RClient.lua from build payload"
          git push
